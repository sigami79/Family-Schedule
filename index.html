<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf9f7">
<title>Family Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --luke: #2563C8;
  --luke-light: #EBF1FC;
  --jenny: #C0395A;
  --jenny-light: #FCEDF1;
  --yujung: #2e7d32;
  --yujung-light: #E8F5E9;
  --unavail-luke: #b45309;
  --unavail-luke-bg: #FEF3C7;
  --unavail-jenny: #be185d;
  --unavail-jenny-bg: #fce7f3;
  --bg: #faf9f7;
  --surface: #ffffff;
  --border: #e8e5e0;
  --text: #1a1816;
  --muted: #8a8680;
  --slot-bg: #f5f3f0;
  --radius: 14px;
  --radius-sm: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100dvh; background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); font-size: 15px; overscroll-behavior: none; }

#loginScreen { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; }
.login-hero { text-align: center; margin-bottom: 32px; }
.login-icon { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, var(--luke-light), var(--jenny-light)); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 32px; }
.login-title { font-family: 'DM Serif Display', serif; font-size: 28px; line-height: 1.1; }
.login-sub { font-size: 14px; color: var(--muted); margin-top: 6px; }
.login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 20px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 18px; }
.field-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.user-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.user-btn { padding: 14px 8px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--slot-bg); cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--muted); transition: all .18s; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.user-btn .uav { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; }
.user-btn.luke .uav { background: var(--luke-light); color: var(--luke); }
.user-btn.jenny .uav { background: var(--jenny-light); color: var(--jenny); }
.user-btn.yujung .uav { background: var(--yujung-light); color: var(--yujung); }
.user-btn.sel-luke { border-color: var(--luke); background: var(--luke-light); color: var(--luke); }
.user-btn.sel-jenny { border-color: var(--jenny); background: var(--jenny-light); color: var(--jenny); }
.user-btn.sel-yujung { border-color: var(--yujung); background: var(--yujung-light); color: var(--yujung); }
.pw-input { width: 100%; padding: 13px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 15px; background: var(--slot-bg); color: var(--text); outline: none; transition: border-color .15s; }
.pw-input:focus { border-color: var(--luke); background: #fff; }
.login-btn { width: 100%; padding: 15px; border: none; border-radius: var(--radius-sm); background: var(--text); color: #fff; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; }
.login-btn:active { opacity: .82; }
.login-err { font-size: 13px; color: var(--jenny); text-align: center; min-height: 18px; }
.hint-box { background: var(--slot-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }

#mainScreen { display: none; flex-direction: column; min-height: 100dvh; }
.topbar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
.av-luke { background: var(--luke-light); color: var(--luke); }
.av-jenny { background: var(--jenny-light); color: var(--jenny); }
.av-yujung { background: var(--yujung-light); color: var(--yujung); }
.topbar-name { font-weight: 600; font-size: 15px; }
.topbar-week { font-size: 12px; color: var(--muted); }
.topbar-right { display: flex; gap: 8px; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 17px; }
.icon-btn:active { background: var(--slot-bg); }

.week-nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; gap: 10px; }
.week-btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text); }
.week-btn:active { background: var(--slot-bg); }
.week-label { font-size: 14px; font-weight: 600; text-align: center; flex: 1; }

.legend { display: flex; gap: 10px; padding: 0 16px 12px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
.ldot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

.section { padding: 0 16px 16px; }
.section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 14px 0 10px; border-top: 1px solid var(--border); }
.slot-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 8px; }
.slot-header { padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--slot-bg); border-bottom: 1px solid var(--border); }

.day-cell { display: flex; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; user-select: none; gap: 8px; }
.day-cell:last-of-type { border-bottom: none; }
.day-cell:active { background: var(--slot-bg); }
.day-name { font-size: 14px; font-weight: 500; min-width: 34px; flex-shrink: 0; }
.stickers { display: flex; gap: 5px; align-items: center; flex: 1; }

.sticker { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.sticker-luke { background: var(--luke); color: #fff; }
.sticker-jenny { background: var(--jenny); color: #fff; }
.sticker-yujung { background: var(--yujung); color: #fff; font-size: 13px; }
.sticker-empty { width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--border); flex-shrink: 0; }

.badge-unavail { display: flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 10px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
.badge-luke { background: var(--unavail-luke-bg); color: var(--unavail-luke); border: 1.5px solid var(--unavail-luke); }
.badge-jenny { background: var(--unavail-jenny-bg); color: var(--unavail-jenny); border: 1.5px solid var(--unavail-jenny); }

.my-status { font-size: 11px; color: var(--muted); font-weight: 500; flex-shrink: 0; margin-left: auto; }
.st-luke { color: var(--luke); }
.st-jenny { color: var(--jenny); }
.st-yujung { color: var(--yujung); }
.st-unavail-luke { color: var(--unavail-luke); }
.st-unavail-jenny { color: var(--unavail-jenny); }

/* notes */
.notes-section { border-top: 1px dashed var(--border); }
.notes-toggle { display: flex; align-items: center; gap: 6px; padding: 9px 14px; font-size: 12px; color: var(--muted); cursor: pointer; background: none; border: none; font-family: 'DM Sans', sans-serif; width: 100%; text-align: left; }
.notes-toggle:active { background: var(--slot-bg); }
.notes-body { display: none; }
.notes-body.open { display: block; }
.notes-row { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--border); background: #fffdf9; }
.notes-day-tag { font-size: 11px; font-weight: 600; color: var(--muted); min-width: 34px; flex-shrink: 0; }
.notes-input { flex: 1; border: none; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--text); outline: none; padding: 4px 0; }
.notes-input::placeholder { color: #c4bfb8; }

/* modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal-sheet { background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 20px 36px; width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 14px; max-height: 80dvh; }
.modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 4px; }
.modal-title { font-family: 'DM Serif Display', serif; font-size: 22px; }
.export-text { background: var(--slot-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; font-size: 12px; line-height: 1.7; font-family: monospace; white-space: pre-wrap; overflow-y: auto; max-height: 260px; color: var(--muted); }
.modal-actions { display: flex; gap: 10px; }
.modal-btn { flex: 1; padding: 13px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; background: var(--slot-bg); color: var(--text); }
.modal-btn.primary { background: var(--text); color: #fff; border-color: var(--text); }
.modal-note { font-size: 12px; color: var(--muted); text-align: center; }

.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 500; opacity: 0; transition: all .25s; pointer-events: none; white-space: nowrap; z-index: 200; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.bottom-pad { height: 32px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-hero">
    <div class="login-icon">🌸</div>
    <div class="login-title">Family Schedule</div>
    <div class="login-sub">Luke & Jenny's co-parenting planner</div>
  </div>
  <div class="login-card">
    <div>
      <div class="field-label">Who are you?</div>
      <div class="user-btns">
        <button class="user-btn luke" id="btnLuke" onclick="selectUser('luke')">
          <div class="uav">L</div>Luke
        </button>
        <button class="user-btn jenny" id="btnJenny" onclick="selectUser('jenny')">
          <div class="uav">J</div>Jenny
        </button>
        <button class="user-btn yujung" id="btnYujung" onclick="selectUser('yujung')">
          <div class="uav">🚌</div>Yujung
        </button>
      </div>
    </div>
    <div id="pwSection">
      <div class="field-label">Password</div>
      <input class="pw-input" type="password" id="pwInput" placeholder="Enter your password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">Log in →</button>
    <div class="login-err" id="loginErr"></div>
    <div class="hint-box">
      Luke: <strong>luke123</strong> &nbsp;·&nbsp; Jenny: <strong>jenny123</strong><br>
      Yujung: <strong>no password needed 🚌</strong>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainScreen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-avatar" id="topAvatar"></div>
      <div>
        <div class="topbar-name" id="topName"></div>
        <div class="topbar-week" id="topWeek"></div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" onclick="showExport()" title="Export">📤</button>
      <button class="icon-btn" onclick="logout()" title="Log out">👋</button>
    </div>
  </div>

  <div class="week-nav">
    <button class="week-btn" onclick="changeWeek(-1)">← Prev</button>
    <div class="week-label" id="weekLabel"></div>
    <button class="week-btn" onclick="changeWeek(1)">Next →</button>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="ldot" style="background:var(--luke)"></div> Luke ✓</div>
    <div class="legend-item"><div class="ldot" style="background:var(--jenny)"></div> Jenny ✓</div>
    <div class="legend-item"><div class="ldot" style="background:var(--yujung)"></div> Yujung 🚌</div>
    <div class="legend-item"><div class="ldot" style="background:var(--unavail-luke-bg);border:1.5px solid var(--unavail-luke)"></div> Not available</div>
  </div>

  <div class="section" id="scheduleContent"></div>
  <div class="bottom-pad"></div>
</div>

<!-- EXPORT MODAL -->
<div class="modal-overlay" id="exportModal" onclick="if(event.target===this)closeExport()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Export schedule</div>
    <div class="export-text" id="exportText"></div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeExport()">Close</button>
      <button class="modal-btn primary" onclick="copyExport()">📋 Copy text</button>
    </div>
    <div class="modal-note">Copy into email, SMS or WhatsApp to share.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────
const USERS = {
  luke:   { pass: 'luke123',  label: 'Luke',   initial: 'L',  avClass: 'av-luke',   noPass: false },
  jenny:  { pass: 'jenny123', label: 'Jenny',  initial: 'J',  avClass: 'av-jenny',  noPass: false },
  yujung: { pass: '',         label: 'Yujung', initial: '🚌', avClass: 'av-yujung', noPass: true  }
};

// type 'avail'  = tap to mark available (green sticker)
// type 'unavail'= tap to mark NOT available (amber/pink badge)
// type 'notes'  = unavail + collapsible notes box
const WEEKDAY_SLOTS = [
  { id: 'drop',   label: '🌅 Morning drop-off',  type: 'avail'  },
  { id: 'pickup', label: '🏫 Afternoon pick-up',  type: 'avail'  },  // Yujung bus here
  { id: 'dinner', label: '🍽️ Dinner',             type: 'notes'  },  // not-available + notes
];
const WEEKEND_SLOTS = [
  { id: 'lunch_we',  label: '☀️ Weekend lunch',  type: 'notes' },
  { id: 'dinner_we', label: '🍽️ Weekend dinner', type: 'notes' },
];
const WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri'];
const WEEKEND  = ['Sat','Sun'];

// ── STATE ────────────────────────────────────────────
let currentUser = null, selectedUser = null, weekOffset = 0;
let schedData = {}, notesData = {};

const SK = 'familySched_v2', NK = 'familyNotes_v2';
function loadData() {
  try { schedData = JSON.parse(localStorage.getItem(SK) || '{}'); } catch(e) { schedData = {}; }
  try { notesData = JSON.parse(localStorage.getItem(NK) || '{}'); } catch(e) { notesData = {}; }
}
function saveData()  { try { localStorage.setItem(SK, JSON.stringify(schedData)); } catch(e) {} }
function saveNotes() { try { localStorage.setItem(NK, JSON.stringify(notesData)); } catch(e) {} }

// ── LOGIN ─────────────────────────────────────────────
function selectUser(u) {
  selectedUser = u;
  ['luke','jenny','yujung'].forEach(x => {
    const cap = x.charAt(0).toUpperCase() + x.slice(1);
    document.getElementById('btn' + cap).className = 'user-btn ' + x + (u === x ? ' sel-' + x : '');
  });
  document.getElementById('loginErr').textContent = '';
  if (USERS[u].noPass) {
    document.getElementById('pwSection').style.display = 'none';
    doLogin();
  } else {
    document.getElementById('pwSection').style.display = 'block';
    document.getElementById('pwInput').focus();
  }
}

function doLogin() {
  if (!selectedUser) { document.getElementById('loginErr').textContent = 'Please choose who you are.'; return; }
  const u = USERS[selectedUser];
  if (!u.noPass) {
    const pw = document.getElementById('pwInput').value;
    if (pw !== u.pass) {
      document.getElementById('loginErr').textContent = 'Wrong password — try again.';
      document.getElementById('pwInput').value = ''; return;
    }
  }
  currentUser = selectedUser;
  const av = document.getElementById('topAvatar');
  av.className = 'topbar-avatar ' + u.avClass;
  av.textContent = u.initial;
  document.getElementById('topName').textContent = u.label;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'flex';
  renderAll();
}

function logout() {
  currentUser = null; selectedUser = null;
  document.getElementById('pwInput').value = '';
  document.getElementById('pwSection').style.display = 'block';
  document.getElementById('loginErr').textContent = '';
  ['Luke','Jenny','Yujung'].forEach(n => {
    document.getElementById('btn' + n).className = 'user-btn ' + n.toLowerCase();
  });
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainScreen').style.display = 'none';
}

// ── WEEK HELPERS ──────────────────────────────────────
function getWeekKey() { return 'w' + weekOffset; }
function sKey(slotId, dayIdx) { return getWeekKey() + '_' + slotId + '_' + dayIdx; }
function nKey(slotId, dayIdx) { return getWeekKey() + '_note_' + slotId + '_' + dayIdx; }

function getWeekDates() {
  const now = new Date();
  now.setDate(now.getDate() + weekOffset * 7);
  const d = now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() - d + (d === 0 ? -6 : 1));
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const fmt = x => x.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
  return fmt(mon) + ' – ' + fmt(sun);
}
function changeWeek(d) { weekOffset += d; renderAll(); }

// ── RENDER ────────────────────────────────────────────
function renderAll() {
  const wl = getWeekDates();
  document.getElementById('weekLabel').textContent = wl;
  document.getElementById('topWeek').textContent = wl;
  const content = document.getElementById('scheduleContent');
  content.innerHTML = '';
  appendSection(content, 'Weekdays — Mon to Fri', WEEKDAY_SLOTS, WEEKDAYS, 0);
  appendSection(content, 'Weekend — Sat & Sun',   WEEKEND_SLOTS,  WEEKEND,  5);
}

function appendSection(parent, title, slots, dayNames, dayOffset) {
  const titleEl = document.createElement('div');
  titleEl.className = 'section-title';
  titleEl.textContent = title;
  parent.appendChild(titleEl);

  slots.forEach(slot => {
    const card = document.createElement('div');
    card.className = 'slot-card';

    const header = document.createElement('div');
    header.className = 'slot-header';
    header.textContent = slot.label;
    card.appendChild(header);

    dayNames.forEach((name, i) => {
      const dayIdx = dayOffset + i;
      card.appendChild(buildAvailCell(name, slot, dayIdx));
    });

    // Notes section for dinner / weekend meals
    if (slot.type === 'notes') {
      const ns = document.createElement('div');
      ns.className = 'notes-section';

      const toggle = document.createElement('button');
      toggle.className = 'notes-toggle';
      toggle.innerHTML = '📝 <span>Events &amp; notes</span>';
      toggle.onclick = () => {
        const body = ns.querySelector('.notes-body');
        const open = body.classList.toggle('open');
        toggle.querySelector('span').textContent = open ? 'Hide notes' : 'Events & notes';
      };
      ns.appendChild(toggle);

      const body = document.createElement('div');
      body.className = 'notes-body';
      dayNames.forEach((name, i) => {
        body.appendChild(buildNoteRow(name, slot.id, dayOffset + i));
      });
      ns.appendChild(body);
      card.appendChild(ns);
    }

    parent.appendChild(card);
  });
}

// ── AVAILABILITY CELL ─────────────────────────────────
function buildAvailCell(dayName, slot, dayIdx) {
  const cell = document.createElement('div');
  cell.className = 'day-cell';
  cell.id = 'acell_' + slot.id + '_' + dayIdx;
  cell.innerHTML = renderCell(dayName, slot, dayIdx);
  cell.onclick = () => toggleSlot(slot, dayIdx, dayName);
  return cell;
}

function renderCell(dayName, slot, dayIdx) {
  const val = schedData[sKey(slot.id, dayIdx)] || {};
  const isNotAvailType = slot.type === 'notes' || slot.type === 'unavail';
  const isPickup = slot.id === 'pickup';

  const hasLuke   = !!val.luke;
  const hasJenny  = !!val.jenny;
  const hasYujung = !!val.yujung;

  // Stickers
  let stickersHTML = '';
  if (isNotAvailType) {
    // Show "not available" badges
    stickersHTML += hasLuke
      ? '<div class="badge-unavail badge-luke">✕ Luke</div>'
      : '<div class="sticker-empty"></div>';
    stickersHTML += hasJenny
      ? '<div class="badge-unavail badge-jenny">✕ Jenny</div>'
      : '<div class="sticker-empty"></div>';
  } else {
    stickersHTML += hasLuke  ? '<div class="sticker sticker-luke">L</div>'  : '<div class="sticker-empty"></div>';
    stickersHTML += hasJenny ? '<div class="sticker sticker-jenny">J</div>' : '<div class="sticker-empty"></div>';
    if (isPickup) {
      stickersHTML += hasYujung ? '<div class="sticker sticker-yujung">🚌</div>' : '<div class="sticker-empty"></div>';
    }
  }

  // My status label
  let myOn = false;
  if (currentUser === 'luke') myOn = hasLuke;
  else if (currentUser === 'jenny') myOn = hasJenny;
  else myOn = hasYujung;

  let statusText = '', statusClass = '';
  if (currentUser === 'yujung') {
    if (!isPickup) { statusText = '—'; }
    else { statusText = myOn ? '🚌 On bus!' : 'Tap — bus?'; statusClass = myOn ? 'st-yujung' : ''; }
  } else if (isNotAvailType) {
    if (myOn) {
      statusText = 'Not available';
      statusClass = currentUser === 'luke' ? 'st-unavail-luke' : 'st-unavail-jenny';
    } else {
      statusText = 'Tap if busy';
    }
  } else {
    if (myOn) {
      statusText = 'Available ✓';
      statusClass = currentUser === 'luke' ? 'st-luke' : 'st-jenny';
    } else {
      statusText = 'Tap to mark';
    }
  }

  return `
    <span class="day-name">${dayName}</span>
    <div class="stickers">${stickersHTML}</div>
    <span class="my-status ${statusClass}">${statusText}</span>
  `;
}

function toggleSlot(slot, dayIdx, dayName) {
  // Yujung only interacts with pickup
  if (currentUser === 'yujung' && slot.id !== 'pickup') return;
  const key = sKey(slot.id, dayIdx);
  if (!schedData[key]) schedData[key] = {};
  schedData[key][currentUser] = !schedData[key][currentUser];
  saveData();

  const cell = document.getElementById('acell_' + slot.id + '_' + dayIdx);
  if (cell) {
    cell.innerHTML = renderCell(dayName, slot, dayIdx);
    cell.style.transform = 'scale(0.97)';
    setTimeout(() => cell.style.transform = '', 120);
  }

  const on = !!schedData[key][currentUser];
  const isNotAvail = slot.type === 'notes' || slot.type === 'unavail';
  if (currentUser === 'yujung') showToast(on ? '🚌 Bus ride marked!' : 'Removed');
  else if (isNotAvail) showToast(on ? `✕ ${USERS[currentUser].label} not available` : 'Removed');
  else showToast(on ? `✓ ${USERS[currentUser].label} available` : 'Removed');
}

// ── NOTES ROW ─────────────────────────────────────────
function buildNoteRow(dayName, slotId, dayIdx) {
  const row = document.createElement('div');
  row.className = 'notes-row';
  const key = nKey(slotId, dayIdx);
  const saved = (notesData[key] || '').replace(/"/g, '&quot;');
  row.innerHTML = `
    <span style="font-size:14px;flex-shrink:0">📝</span>
    <span class="notes-day-tag">${dayName}</span>
    <input class="notes-input" type="text" placeholder="Add event, e.g. Art class 4:30pm…" value="${saved}" data-key="${key}">
  `;
  const input = row.querySelector('input');
  input.addEventListener('input', () => { notesData[key] = input.value; saveNotes(); });
  input.addEventListener('click', e => e.stopPropagation());
  return row;
}

// ── EXPORT ────────────────────────────────────────────
function showExport() {
  const week = getWeekDates();
  let text = '📅 Family Schedule\nWeek of ' + week + '\n' + '─'.repeat(26) + '\n\n';
  let hasAny = false;

  const doSection = (title, slots, dayNames, dayOffset) => {
    let block = title + '\n'; let hasSlot = false;
    slots.forEach(slot => {
      const isNotAvail = slot.type === 'notes' || slot.type === 'unavail';
      let lines = [];
      dayNames.forEach((name, i) => {
        const di = dayOffset + i;
        const val = schedData[sKey(slot.id, di)] || {};
        const note = notesData[nKey(slot.id, di)] || '';
        const who = [];
        if (isNotAvail) {
          if (val.luke)  who.push('Luke — not available');
          if (val.jenny) who.push('Jenny — not available');
        } else {
          if (val.luke)   who.push('Luke ✓');
          if (val.jenny)  who.push('Jenny ✓');
          if (slot.id === 'pickup' && val.yujung) who.push('Yujung 🚌 bus');
        }
        if (who.length || note) {
          let l = '  ' + name + (who.length ? ': ' + who.join(', ') : '');
          if (note) l += '\n    📝 ' + note;
          lines.push(l);
        }
      });
      if (lines.length) {
        const lbl = slot.label.replace(/[\u{1F300}-\u{1FFFF}]/gu, '').trim();
        block += lbl + '\n' + lines.join('\n') + '\n';
        hasSlot = true;
      }
    });
    if (hasSlot) { text += block + '\n'; hasAny = true; }
  };

  doSection('Weekdays (Mon–Fri)', WEEKDAY_SLOTS, WEEKDAYS, 0);
  doSection('Weekend (Sat–Sun)',   WEEKEND_SLOTS,  WEEKEND,  5);
  if (!hasAny) text += '(Nothing marked this week yet)\n';
  text += '\nGenerated by Family Schedule App';

  document.getElementById('exportText').textContent = text;
  document.getElementById('exportModal').classList.add('open');
}

function closeExport() { document.getElementById('exportModal').classList.remove('open'); }

function copyExport() {
  const txt = document.getElementById('exportText').textContent;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => showToast('Copied!'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('Copied!');
  }
  closeExport();
}

// ── TOAST ──────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ── INIT ───────────────────────────────────────────────
loadData();
</script>
