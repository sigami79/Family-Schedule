<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf9f7">
<title>Family Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --luke: #2563C8;
  --luke-light: #EBF1FC;
  --luke-mid: #93B4ED;
  --jenny: #C0395A;
  --jenny-light: #FCEDF1;
  --jenny-mid: #E89AAF;
  --bg: #faf9f7;
  --surface: #ffffff;
  --border: #e8e5e0;
  --text: #1a1816;
  --muted: #8a8680;
  --slot-bg: #f5f3f0;
  --radius: 14px;
  --radius-sm: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  min-height: 100dvh;
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  font-size: 15px;
  overscroll-behavior: none;
}

/* ── LOGIN ── */
#loginScreen {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  gap: 0;
}

.login-hero {
  text-align: center;
  margin-bottom: 36px;
}

.login-icon {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--luke-light), var(--jenny-light));
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
  font-size: 32px;
}

.login-title {
  font-family: 'DM Serif Display', serif;
  font-size: 28px;
  color: var(--text);
  line-height: 1.1;
}

.login-sub {
  font-size: 14px;
  color: var(--muted);
  margin-top: 6px;
}

.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 20px;
  width: 100%;
  max-width: 360px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.field-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.user-btns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.user-btn {
  padding: 14px 10px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: var(--slot-bg);
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 500;
  color: var(--muted);
  transition: all .18s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.user-btn .user-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 600;
  transition: all .18s;
}

.user-btn.luke .user-avatar { background: var(--luke-light); color: var(--luke); }
.user-btn.jenny .user-avatar { background: var(--jenny-light); color: var(--jenny); }

.user-btn.selected-luke {
  border-color: var(--luke);
  background: var(--luke-light);
  color: var(--luke);
}
.user-btn.selected-jenny {
  border-color: var(--jenny);
  background: var(--jenny-light);
  color: var(--jenny);
}

.pw-input {
  width: 100%;
  padding: 13px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  background: var(--slot-bg);
  color: var(--text);
  outline: none;
  transition: border-color .15s;
}
.pw-input:focus { border-color: var(--luke); background: #fff; }

.login-btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--text);
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
}
.login-btn:active { transform: scale(0.98); opacity: 0.88; }

.login-err {
  font-size: 13px;
  color: var(--jenny);
  text-align: center;
  min-height: 18px;
}

.hint-box {
  background: var(--slot-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  line-height: 1.6;
}

/* ── MAIN APP ── */
#mainScreen { display: none; flex-direction: column; min-height: 100dvh; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.topbar-left { display: flex; align-items: center; gap: 10px; }

.topbar-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
}
.av-luke { background: var(--luke-light); color: var(--luke); }
.av-jenny { background: var(--jenny-light); color: var(--jenny); }

.topbar-name { font-weight: 600; font-size: 15px; }
.topbar-week { font-size: 12px; color: var(--muted); }

.topbar-right { display: flex; gap: 8px; }

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 17px;
  transition: background .15s;
  color: var(--text);
}
.icon-btn:active { background: var(--slot-bg); }

/* Week nav */
.week-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  gap: 10px;
}

.week-btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--surface);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  color: var(--text);
  transition: background .15s;
}
.week-btn:active { background: var(--slot-bg); }

.week-label {
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  flex: 1;
}

/* Legend */
.legend {
  display: flex;
  gap: 14px;
  padding: 0 16px 12px;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}

.ldot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Schedule sections */
.section {
  padding: 0 16px 16px;
}

.section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 14px 0 10px;
  border-top: 1px solid var(--border);
}

.slot-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 2px;
}

.slot-header {
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  background: var(--slot-bg);
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.01em;
}

.day-row {
  display: grid;
  gap: 0;
}

.day-cell {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .1s;
  user-select: none;
}

.day-cell:last-child { border-bottom: none; }
.day-cell:active { background: var(--slot-bg); }

.day-name {
  font-size: 14px;
  font-weight: 500;
  min-width: 36px;
}

.stickers {
  display: flex;
  gap: 6px;
  align-items: center;
}

.sticker {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0;
  transition: transform .15s;
}

.sticker-luke { background: var(--luke); color: #fff; }
.sticker-jenny { background: var(--jenny); color: #fff; }
.sticker-empty {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px dashed var(--border);
}

.my-status {
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
}
.my-status.on-luke { color: var(--luke); }
.my-status.on-jenny { color: var(--jenny); }

/* Bottom padding for iOS home indicator */
.bottom-pad { height: 32px; }

/* ── EXPORT MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal-sheet {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding: 20px 20px 36px;
  width: 100%;
  max-width: 500px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-height: 80dvh;
}

.modal-handle {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  margin: 0 auto 4px;
}

.modal-title {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
}

.export-text {
  background: var(--slot-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px;
  font-size: 12px;
  line-height: 1.7;
  font-family: monospace;
  white-space: pre-wrap;
  overflow-y: auto;
  max-height: 280px;
  color: var(--muted);
}

.modal-actions { display: flex; gap: 10px; }

.modal-btn {
  flex: 1;
  padding: 13px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  background: var(--slot-bg);
  color: var(--text);
  transition: opacity .15s;
}
.modal-btn:active { opacity: .75; }
.modal-btn.primary {
  background: var(--text);
  color: #fff;
  border-color: var(--text);
}

.modal-note {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text);
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: all .25s;
  pointer-events: none;
  white-space: nowrap;
  z-index: 200;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-hero">
    <div class="login-icon">🌸</div>
    <div class="login-title">Family Schedule</div>
    <div class="login-sub">Luke & Jenny's co-parenting planner</div>
  </div>

  <div class="login-card">
    <div>
      <div class="field-label">Who are you?</div>
      <div class="user-btns">
        <button class="user-btn luke" id="btnLuke" onclick="selectUser('luke')">
          <div class="user-avatar">L</div>
          Luke
        </button>
        <button class="user-btn jenny" id="btnJenny" onclick="selectUser('jenny')">
          <div class="user-avatar">J</div>
          Jenny
        </button>
      </div>
    </div>

    <div>
      <div class="field-label">Password</div>
      <input class="pw-input" type="password" id="pwInput" placeholder="Enter your password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>

    <button class="login-btn" onclick="doLogin()">Log in →</button>
    <div class="login-err" id="loginErr"></div>

    <div class="hint-box">
      Luke's password: <strong>luke123</strong><br>
      Jenny's password: <strong>jenny123</strong><br>
      <span style="font-size:11px;margin-top:4px;display:block">You can change these in the code anytime</span>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainScreen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-avatar" id="topAvatar"></div>
      <div>
        <div class="topbar-name" id="topName"></div>
        <div class="topbar-week" id="topWeek"></div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" onclick="showExport()" title="Export schedule">📤</button>
      <button class="icon-btn" onclick="logout()" title="Log out">👋</button>
    </div>
  </div>

  <div class="week-nav">
    <button class="week-btn" onclick="changeWeek(-1)">← Prev</button>
    <div class="week-label" id="weekLabel"></div>
    <button class="week-btn" onclick="changeWeek(1)">Next →</button>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="ldot" style="background:var(--luke)"></div> Luke available</div>
    <div class="legend-item"><div class="ldot" style="background:var(--jenny)"></div> Jenny available</div>
    <div class="legend-item"><div class="ldot" style="border:1.5px dashed #ccc;background:transparent"></div> Not set</div>
  </div>

  <div class="section" id="scheduleContent"></div>
  <div class="bottom-pad"></div>
</div>

<!-- EXPORT MODAL -->
<div class="modal-overlay" id="exportModal" onclick="if(event.target===this)closeExport()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Export schedule</div>
    <div class="export-text" id="exportText"></div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeExport()">Close</button>
      <button class="modal-btn primary" onclick="copyExport()">📋 Copy text</button>
    </div>
    <div class="modal-note">Copy this into an email, SMS or WhatsApp to share with each other.</div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────
const USERS = {
  luke:  { pass: 'luke123',  label: 'Luke',  initial: 'L', avClass: 'av-luke' },
  jenny: { pass: 'jenny123', label: 'Jenny', initial: 'J', avClass: 'av-jenny' }
};

const WEEKDAY_SLOTS = [
  { id: 'drop',    label: '🌅 Morning drop-off' },
  { id: 'pickup',  label: '🏫 Afternoon pick-up' },
  { id: 'dinner',  label: '🍽️ Dinner' },
  { id: 'overnight', label: '🌙 Overnight stay' },
];

const WEEKEND_SLOTS = [
  { id: 'lunch_we',    label: '☀️ Lunch' },
  { id: 'dinner_we',   label: '🍽️ Dinner' },
  { id: 'overnight_we', label: '🌙 Overnight stay' },
];

const WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri'];
const WEEKEND  = ['Sat','Sun'];

// ── STATE ────────────────────────────────────────────────
let currentUser = null;
let selectedUser = null;
let weekOffset = 0;
let schedData = {};

// ── STORAGE (localStorage — works across phones via any hosting) ──
const STORAGE_KEY = 'familySchedule_v1';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    schedData = raw ? JSON.parse(raw) : {};
  } catch(e) { schedData = {}; }
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(schedData)); } catch(e) {}
}

// ── LOGIN ─────────────────────────────────────────────────
function selectUser(u) {
  selectedUser = u;
  document.getElementById('btnLuke').className  = 'user-btn luke'  + (u==='luke' ? ' selected-luke' : '');
  document.getElementById('btnJenny').className = 'user-btn jenny' + (u==='jenny'? ' selected-jenny':'');
  document.getElementById('loginErr').textContent = '';
  document.getElementById('pwInput').focus();
}

function doLogin() {
  if (!selectedUser) {
    document.getElementById('loginErr').textContent = 'Please choose Luke or Jenny first.';
    return;
  }
  const pw = document.getElementById('pwInput').value;
  if (pw !== USERS[selectedUser].pass) {
    document.getElementById('loginErr').textContent = 'Wrong password — try again.';
    document.getElementById('pwInput').value = '';
    return;
  }
  currentUser = selectedUser;
  const u = USERS[currentUser];
  const av = document.getElementById('topAvatar');
  av.className = 'topbar-avatar ' + u.avClass;
  av.textContent = u.initial;
  document.getElementById('topName').textContent = u.label;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'flex';
  renderAll();
}

function logout() {
  currentUser = null; selectedUser = null;
  document.getElementById('pwInput').value = '';
  document.getElementById('loginErr').textContent = '';
  document.getElementById('btnLuke').className  = 'user-btn luke';
  document.getElementById('btnJenny').className = 'user-btn jenny';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainScreen').style.display = 'none';
}

// ── WEEK HELPERS ──────────────────────────────────────────
function getWeekKey() { return 'w' + weekOffset; }

function getSlotKey(slotId, dayIdx) {
  return getWeekKey() + '_' + slotId + '_' + dayIdx;
}

function getWeekDates() {
  const now = new Date();
  now.setDate(now.getDate() + weekOffset * 7);
  const day = now.getDay();
  const diff = now.getDate() - day + (day === 0 ? -6 : 1);
  const mon = new Date(now); mon.setDate(diff);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const fmt = d => d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
  return fmt(mon) + ' – ' + fmt(sun);
}

function changeWeek(d) {
  weekOffset += d;
  renderAll();
}

// ── RENDER ────────────────────────────────────────────────
function renderAll() {
  const wl = getWeekDates();
  document.getElementById('weekLabel').textContent = wl;
  document.getElementById('topWeek').textContent   = wl;

  const content = document.getElementById('scheduleContent');
  content.innerHTML = '';

  // Weekdays section
  appendSection(content, 'Weekdays — Mon to Fri', WEEKDAY_SLOTS, WEEKDAYS, 0);

  // Weekend section
  appendSection(content, 'Weekend — Sat & Sun', WEEKEND_SLOTS, WEEKEND, 5);
}

function appendSection(parent, title, slots, dayNames, dayOffset) {
  const titleEl = document.createElement('div');
  titleEl.className = 'section-title';
  titleEl.textContent = title;
  parent.appendChild(titleEl);

  slots.forEach(slot => {
    const card = document.createElement('div');
    card.className = 'slot-card';

    const header = document.createElement('div');
    header.className = 'slot-header';
    header.textContent = slot.label;
    card.appendChild(header);

    dayNames.forEach((name, i) => {
      const dayIdx = dayOffset + i;
      const cell = buildDayCell(name, slot.id, dayIdx);
      card.appendChild(cell);
    });

    parent.appendChild(card);
  });
}

function buildDayCell(dayName, slotId, dayIdx) {
  const key = getSlotKey(slotId, dayIdx);
  const val = schedData[key] || {};

  const cell = document.createElement('div');
  cell.className = 'day-cell';
  cell.id = 'cell_' + slotId + '_' + dayIdx;

  cell.innerHTML = renderCellInner(dayName, val);
  cell.onclick = () => toggleSlot(slotId, dayIdx, dayName);
  return cell;
}

function renderCellInner(dayName, val) {
  const hasLuke  = !!val.luke;
  const hasJenny = !!val.jenny;
  const myOn = currentUser === 'luke' ? hasLuke : hasJenny;
  const statusText = myOn ? 'Tap to remove' : 'Tap to add ✓';
  const statusClass = myOn ? (currentUser === 'luke' ? 'on-luke' : 'on-jenny') : '';

  let stickers = '';
  stickers += hasLuke
    ? '<div class="sticker sticker-luke">L</div>'
    : '<div class="sticker-empty"></div>';
  stickers += hasJenny
    ? '<div class="sticker sticker-jenny">J</div>'
    : '<div class="sticker-empty"></div>';

  return `
    <span class="day-name">${dayName}</span>
    <div class="stickers">${stickers}</div>
    <span class="my-status ${statusClass}">${statusText}</span>
  `;
}

function toggleSlot(slotId, dayIdx, dayName) {
  const key = getSlotKey(slotId, dayIdx);
  if (!schedData[key]) schedData[key] = {};
  schedData[key][currentUser] = !schedData[key][currentUser];
  saveData();

  const cell = document.getElementById('cell_' + slotId + '_' + dayIdx);
  if (cell) {
    cell.innerHTML = renderCellInner(dayName, schedData[key]);
    cell.onclick = () => toggleSlot(slotId, dayIdx, dayName);
    cell.style.transform = 'scale(0.97)';
    setTimeout(() => cell.style.transform = '', 120);
  }

  const isNowOn = !!schedData[key][currentUser];
  showToast(isNowOn ? '✓ Marked available' : 'Removed');
}

// ── EXPORT ────────────────────────────────────────────────
function showExport() {
  const week = getWeekDates();
  let text = '📅 Family Schedule\n';
  text += 'Week of ' + week + '\n';
  text += '─'.repeat(30) + '\n\n';

  let hasAny = false;

  const buildSection = (title, slots, dayNames, dayOffset) => {
    let block = title + '\n';
    let hasSlot = false;
    slots.forEach(slot => {
      const activeDays = [];
      dayNames.forEach((name, i) => {
        const key = getSlotKey(slot.id, dayOffset + i);
        const val = schedData[key] || {};
        const who = [];
        if (val.luke)  who.push('Luke');
        if (val.jenny) who.push('Jenny');
        if (who.length) activeDays.push('  ' + name + ': ' + who.join(' & '));
      });
      if (activeDays.length) {
        block += slot.label.replace(/[🌅🏫🍽️🌙☀️]/gu, '').trim() + '\n';
        block += activeDays.join('\n') + '\n';
        hasSlot = true;
      }
    });
    if (hasSlot) { text += block + '\n'; hasAny = true; }
  };

  buildSection('Weekdays (Mon–Fri)', WEEKDAY_SLOTS, WEEKDAYS, 0);
  buildSection('Weekend (Sat–Sun)', WEEKEND_SLOTS, WEEKEND, 5);

  if (!hasAny) text += '(No availability marked this week yet)\n';
  text += '\nGenerated by Family Schedule App';

  document.getElementById('exportText').textContent = text;
  document.getElementById('exportModal').classList.add('open');
}

function closeExport() {
  document.getElementById('exportModal').classList.remove('open');
}

function copyExport() {
  const txt = document.getElementById('exportText').textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => showToast('Copied to clipboard!'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Copied!');
  }
  closeExport();
}

// ── TOAST ─────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ── INIT ──────────────────────────────────────────────────
loadData();
</script>
</body>
